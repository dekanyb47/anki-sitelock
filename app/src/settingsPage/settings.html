<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="/app/assets/base.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <h1>Anki SiteLock config</h1>
    <hr>

    <!-- TODO: add help for input -->
    <form method="post" id="settingsForm" autocomplete="off"> 
      <div class="settingsEntryCont">
        <label class="settingsLabel" for="websitesInput">Websites to lock (separated by semicolons): </label>
        <input type="text" id="websitesInput" class="settingsInput" autocomplete="off">
      </div>

      <div class="settingsEntryCont">
        <label class="settingsLabel">Decks to check (separated by semicolons): </label>
        <input type="text" id="decksInput" class="settingsInput" autocomplete="off">
      </div>
      <h4 class="note">
        Note: Anki deck notation looks like this: 'parentDeckName::subDeckName'.<br>
        - By entering 'parentDeckName', the extension checks every card within the deck and all its subdecks.<br>
        - By entering 'parentDeckName::subDecksName', the extension checks only cards within 'subDecksName'!
      </h4>

      <div class="settingsEntryCont">
        <label class="settingsLabel">Unlock price: </label>
        <input type="number" id="unlockPriceInput" class="settingsInput" autocomplete="off">
      </div>

      <div class="settingsEntryCont">
        <label class="settingsLabel">Unlock time: </label>
        <input type="number" id="unlockTimeInput" class="settingsInput" autocomplete="off">
      </div>

      <button type="submit" id="saveSettingsButton">Save</button>
    </form>
  </main>

  <script src="/app/src/helper/URLUtils.js"></script>
  <script src="/app/src/helper/validationUtils.js"></script>

  <script src="settings.js"></script>
</body>
</html>
